<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Carrom King Pro</title>
    <style>
        :root { --primary: #f39c12; --secondary: #e67e22; --bg: #fff5e6; }
        body { background: linear-gradient(135deg, #fff5e6 0%, #ffeaa7 100%); margin: 0; font-family: 'Arial', sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        .top-bar { width: 95%; display: flex; justify-content: space-between; padding: 20px; color: #d35400; font-weight: bold; }
        .user-stat { background: rgba(255, 255, 255, 0.6); padding: 5px 15px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .main-menu { margin-top: 50px; display: flex; flex-direction: column; gap: 20px; width: 80%; max-width: 300px; }
        .btn { padding: 20px; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn:active { transform: scale(0.95); }
        
        #profile-screen { display: none; background: white; width: 90%; padding: 20px; border-radius: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="user-stat">💰 1500 Coins</div>
        <div class="user-stat">🏆 12 Wins</div>
    </div>

    <div class="main-menu" id="home-screen">
        <button class="btn" style="background:#3498db; color:white" onclick="showProfile()">👤 প্রোফাইল</button>
        <button class="btn" style="background:#2ecc71; color:white" onclick="alert('রুম তৈরির পেজ আসবে')">🤝 বন্ধুদের সাথে খেলা</button>
        <button class="btn" style="background:#9b59b6; color:white" onclick="alert('অনলাইন ম্যাচমেকিং')">🌐 অনলাইনে খেলা</button>
    </div>

    <div id="profile-screen">
        <h2>👤 Shamim</h2>
        <p>মোট জয়: ১২টি</p>
        <p>কয়েন: ১,৫০০</p>
        <button onclick="hideProfile()">ফিরে যাও</button>
    </div>

    <script>
        function showProfile() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('profile-screen').style.display = 'block';
        }
        function hideProfile() {
            document.getElementById('home-screen').style.display = 'flex';
            document.getElementById('profile-screen').style.display = 'none';
        }
    </script>
</body>
</html>
